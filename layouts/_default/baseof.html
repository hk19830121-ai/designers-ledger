<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="google-site-verification" content="vQTMnl3DsNsPU5T-YXd78SVirH_kBZgOK5T4UpNzhG4">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <a class="site-title" href="/">{{ .Site.Title }}</a>
  <p class="site-tagline">{{ .Site.Params.tagline }}</p>
  <nav>
    <a href="/">Home</a>
    <a href="/about/">About</a>
    <a href="/affiliate-disclosure/">Affiliate Disclosure</a>
  </nav>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site-footer">
  <p>&copy; {{ now.Year }} {{ .Site.Title }}. <a href="/privacy/">Privacy Policy</a> &middot; <a href="/affiliate-disclosure/">Affiliate Disclosure</a></p>
</footer>
</body>
</html>
