{{ define "main" }}
<section class="intro">
  <h1>{{ .Site.Title }}</h1>
  <p>{{ .Site.Params.description }}</p>
</section>
<h2>Latest articles</h2>
<ul class="post-list">
{{ range where .Site.RegularPages "Section" "posts" }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </li>
{{ else }}
  <li>Articles are on the way.</li>
{{ end }}
</ul>
{{ end }}
